site_name: Continuous delivery
site_description: Een model met assen, mijn opinie en scenario's met werkende showcases.
site_url: https://sim007.github.io/ContinuousDelivery/
repo_url: https://github.com/Sim007/ContinuousDelivery
repo_name: Sim007/ContinuousDelivery
theme:
  name: material
  language: nl
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Donker}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Licht}
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
hooks:
  - hooks/schuiven.py
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc: {permalink: true}
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: nl
          name: Nederlands
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Het model: The model
            Scenario's: Scenarios
            Verhaal en presentatie: Story and presentation
            Praatplaat en visuals: Visuals
            Terminologie: Terminology
            Open punten: Open items
            Over mij: About me
nav:
  - Home: index.md
  - Het model: model.md
  - Scenario's:
      - scenarios/index.md
      - Subdomein binnen enterprise: scenarios/subdomein-enterprise.md
      - Startup: scenarios/startup.md
  - Showcases: showcases.md
  - Verhaal en presentatie: verhaal-presentatie.md
  - Praatplaat en visuals: visuals.md
  - Terminologie: terminologie.md
  - Open punten: open-punten.md
  - Over mij: over.md
